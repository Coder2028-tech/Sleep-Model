<form id="sleepForm" method="POST">
  <label>Age:</label>
  <input type="number" name="age" required><br>

  <label>Activity:</label>
  <select name="activity" required>
    <option value="low">Low</option>
    <option value="moderate" selected>Moderate</option>
    <option value="high">High</option>
  </select><br>

  <label>Energy:</label>
  <select name="energy" required>
    <option value="low">Low</option>
    <option value="moderate" selected>Moderate</option>
    <option value="high">High</option>
  </select><br>

  <label>Anxiety:</label>
  <select name="anxiety" required>
    <option value="low">Low</option>
    <option value="moderate" selected>Moderate</option>
    <option value="high">High</option>
  </select><br>

  <label>Brain Performance:</label>
  <select name="brain" required>
    <option value="low">Low</option>
    <option value="moderate" selected>Moderate</option>
    <option value="high">High</option>
  </select><br>

  <button type="submit">Predict Sleep</button>
</form>

<div id="result">
  {% if result %}
    <p>Recommended Sleep: {{ result }}</p>
  {% endif %}
</div>

<script>
  // Prevent scroll jump on form submit
  const form = document.getElementById("sleepForm");
  form.addEventListener("submit", function(e) {
    e.preventDefault(); // stop default reload
    this.submit();      // submit normally, but keeps scroll position
  });

  // Clear result on page reload
  window.addEventListener("beforeunload", function() {
    document.getElementById("result").innerHTML = "";
  });
</script>
